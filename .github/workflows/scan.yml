# 每小时抓一轮羊毛，用 Claude Haiku 5.5 审核，状态提交回仓库，网页发布到 GitHub Pages。
# 启用：Settings → Pages → Source 选「GitHub Actions」；AI 审核需要在 Settings → Secrets 配置 ANTHROPIC_API_KEY。
name: scan

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**", "site/data.js", "**.md"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 抓取、AI 审核并生成网页数据
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 run.py
      - name: 保存状态
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/state.json site/data.js
          if ! git diff --cached --quiet; then
            git commit -m "scan: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
